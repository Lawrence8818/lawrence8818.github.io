# 部署到 GitHub Pages(main 分支每次 push 自动触发)
#
# ⚠️ 一次性手动设置:GitHub 仓库 Settings → Pages → Source 选 "GitHub Actions"
#
# 🌐 以后切换到自定义域名 lawrencelawproperty.com 时,只需三步:
#   1. 把下面 env 改成:
#        SITE_URL: https://lawrencelawproperty.com
#        BASE_PATH: /
#   2. 新建文件 public/CNAME,内容一行:lawrencelawproperty.com
#   3. 到域名 DNS 把 www/apex 指向 GitHub Pages(见 README)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://lawrence8818.github.io
  BASE_PATH: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # auto-enable GitHub Pages (Source: GitHub Actions) on first deploy
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
