# 部署到 GitHub Pages(main 分支每次 push 自动触发)
#
# ⚠️ 一次性手动设置:GitHub 仓库 Settings → Pages → Source 选 "GitHub Actions"
#
# 🌐 已切换到自定义域名 www.lawrencelawproperty.com(两步走:先 www,再 apex)。
#    env 和 public/CNAME 都已就位;DNS 步骤见私有仓库 deploy/SWITCH-RUNBOOK.md。
#    BASE_PATH 本来就是 / —— 用户站从根目录服务,不要改成别的。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://www.lawrencelawproperty.com
  BASE_PATH: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # auto-enable GitHub Pages (Source: GitHub Actions) on first deploy
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
